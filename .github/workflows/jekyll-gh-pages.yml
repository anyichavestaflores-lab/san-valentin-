<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para Anayely 💖</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffd6e8, #fff1f7);
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
               - nombre: Configurar el entorno Node.js
  usos: acciones/setup-node@v6.2.0
  con:
    Especificación de la versión a utilizar. Ejemplos: 12.x, 10.15.1, >=10.15.0.
    versión del nodo: # opcional
    Archivo que contiene la especificación de la versión a utilizar. Ejemplos: package.json, .nvmrc, .node-version, .tool-versions.
    archivo-versión-nodo: # opcional
    # Arquitectura de destino que usará el nodo. Ejemplos: x86, x64. Se usará la arquitectura del sistema por defecto.
    arquitectura: # opcional
    # Configure esta opción si desea que la acción busque la última versión disponible que satisfaga la especificación de la versión.
    check-latest: # opcional
    Registro opcional para la autenticación. Se establecerá el registro en archivos .npmrc y .yarnrc a nivel de proyecto y se configurará la autenticación para leer desde env.NODE_AUTH_TOKEN.
    URL del registro: # opcional
    # Ámbito opcional para la autenticación en registros con ámbito. Se recurrirá al propietario del repositorio al usar el registro de paquetes de GitHub (https://npm.pkg.github.com/).
    alcance: # opcional
    # Se usa para extraer distribuciones de nodos de node-versions. Dado que hay un valor predeterminado, normalmente el usuario no lo proporciona. Al ejecutar esta acción en github.com, el valor predeterminado es suficiente. Al ejecutar en GHES, puede pasar un token de acceso personal a github.com si experimenta limitaciones de velocidad.
    token: # opcional, el valor predeterminado es ${{ github.server_url == 'https://github.com' && github.token || '' }}
    # Se utiliza para especificar un gestor de paquetes para el almacenamiento en caché en el directorio predeterminado. Valores admitidos: npm, yarn, pnpm.
    caché: # opcional
    # Establézcalo en falso para deshabilitar el almacenamiento en caché automático. De forma predeterminada, el almacenamiento en caché se habilita cuando devEngines.packageManager o el campo packageManager de nivel superior en package.json especifica npm como gestor de paquetes.
    package-manager-cache: # opcional, el valor predeterminado es verdadero
    # Se utiliza para especificar la ruta a un archivo de dependencia: package-lock.json, yarn.lock, etc. Admite caracteres comodín o una lista de nombres de archivos para almacenar en caché múltiples dependencias.
    ruta de dependencia de caché: # opcional
    # Se utiliza para especificar un espejo alternativo desde el cual descargar binarios de Node.js
    espejo: # opcional
    # El token utilizado como encabezado de autorización al obtener desde el espejo
    token espejo: # opcional
             margin: 0;
    }
    .carta {
      background: white;
      padding: 40px;
      max-width: 600px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
    }
    h1 {
      color: #e75480;
    }
    p {
      color: #444;
      line-height: 1.7;
      font-size: 17px;
      text-align: justify;
    }
    .boton {
      margin-top: 30px;
    }
    button {
      background: #e75480;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.1);
      background: #d94370;
    }
  </style>
</head>
<body>

  <div class="carta">
    <h1>Para Anayely 💖</h1>

    <p>
      Amor mío,<br><br>
      No sé muy bien por dónde empezar, porque cuando se trata de ti las palabras a veces se me quedan cortas.
      Desde que llegaste a mi vida, muchas cosas cambiaron sin que yo me diera cuenta: mis días son más bonitos,
      mis sonrisas más sinceras y mi corazón más tranquilo. Contigo aprendí que el amor no solo se dice,
      se siente en los pequeños detalles, en las miradas, en las risas compartidas y en el simple hecho de saber
      que estás ahí.
      <br><br>
      Hoy quiero decirte algo que nace desde lo más profundo de mi corazón. Este San Valentín no quiero que sea
      solo una fecha más, quiero que sea un recuerdo, un momento nuestro, una celebración de lo que somos y de
      todo lo que estamos construyendo juntos. Quiero compartir contigo risas, abrazos largos, miradas cómplices
      y ese amor tan bonito que poco a poco ha ido creciendo entre nosotros.
      <br><br>
      Con todo el cariño, la ilusión y el amor que siento por ti, quiero preguntarte algo muy especial:
    </p>

    <h2>¿Quieres ser mi San Valentín? 💘</h2>

    <div class="boton">
      <button onclick="alert('💖 Ella dijo que SÍ 💖')">
        SÍ 💕
      </button>
    </div>
  </div>

</body>
</html>


      
